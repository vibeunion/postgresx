name: Agent Code Quality Remediation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'agent/fix-code-quality-findings'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgredis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgredis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply focused fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          integration = Path("packages/pgredis/src/integration.test.ts")
          integration_text = integration.read_text()
          missing_await_expression = "reopenedSql?.close() ?? Promise.resolve()"
          awaited_expression = "reopenedSql ? reopenedSql.close() : Promise.resolve()"
          if missing_await_expression not in integration_text:
              raise SystemExit("expected optional close expression was not found")
          integration.write_text(
              integration_text.replace(missing_await_expression, awaited_expression, 1)
          )

          ioredis_test = Path("packages/pgredis/src/adapters/ioredis.test.ts")
          ioredis_text = ioredis_test.read_text()
          unused_import = 'import { UnsupportedCommandError } from "../errors";\n'
          if unused_import not in ioredis_text:
              raise SystemExit("expected unused import was not found")
          ioredis_test.write_text(ioredis_text.replace(unused_import, "", 1))
          PY

          git diff --check
          git diff -- packages/pgredis/src/integration.test.ts packages/pgredis/src/adapters/ioredis.test.ts

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run check

      - name: Run affected unit test
        run: bun test packages/pgredis/src/adapters/ioredis.test.ts

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pgredis
        run: bun run test:integration

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/pgredis/src/integration.test.ts packages/pgredis/src/adapters/ioredis.test.ts
          git commit -m "fix: resolve code quality findings"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
